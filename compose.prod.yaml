services:
  api:
    environment:
      - HALLIGALLI_TRUSTED_PROXY_HOPS=2
  caddy:
    image: caddy:2.11-alpine@sha256:24ec7b05bc532c7bb57f727030c5056e257ff7138b4b50460306819ff79362bd
    ports:
      - 80:80
      - 443:443
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_started
volumes:
    caddy_data:
    caddy_config: