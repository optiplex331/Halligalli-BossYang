services:
  api:
    environment:
      - HALLIGALLI_TRUSTED_PROXY_HOPS=2
    restart: unless-stopped
  caddy:
    image: caddy:2.11-alpine@sha256:003a97808e781aa9f7e75cc2f43d34d461099031faf5e20faefb9f61126836f0
    ports:
      - 80:80
      - 443:443
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_started
    restart: unless-stopped
  redis:
    restart: unless-stopped
  web:
    restart: unless-stopped
volumes:
    caddy_data:
    caddy_config:

