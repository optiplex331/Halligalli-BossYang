services:
  api:
    build: ./apps/api
    ports:
      - 8000:8000
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - HALLIGALLI_REDIS_URL=redis://redis:6379/0

  redis:
    image: redis:8-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 10