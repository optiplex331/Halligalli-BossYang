server {
    listen 80;

    location / {
        root /usr/share/nginx/html;
        index index.html;
    }

    # No trailing slash: the API routes keep the /api prefix.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Upgrade and Connection are hop-by-hop headers, so nginx drops them unless they are set again.
    location /ws/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
